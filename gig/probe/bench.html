<!doctype html><meta charset="utf-8"><title>RPi-VJ GPU bench</title>
<style>body{background:#07090c;color:#d7e2ea;font:13px/1.45 ui-monospace,monospace;margin:0;padding:14px}
pre{white-space:pre-wrap;margin:0}#err{color:#ff5b7f}canvas{display:none}</style>
<pre id="out">starting…</pre><pre id="err"></pre><canvas id="c"></canvas>
<script>
var LINES = [], postTimer = null;
var outEl = document.getElementById('out'), errEl = document.getElementById('err');
function log(s) {
  LINES.push(s === undefined ? '' : String(s));
  outEl.textContent = LINES.join('\n');
  if (postTimer) clearTimeout(postTimer);
  postTimer = setTimeout(flush, 400);
}
function flush() {
  try { fetch('/collect?name=bench', { method: 'POST', body: LINES.join('\n'), keepalive: true }); } catch (e) {}
}
function fail(where, e) {
  var m = 'ERROR in ' + where + ': ' + (e && e.message ? e.message : e);
  errEl.textContent += m + '\n';
  log(m);
  if (e && e.stack) log(String(e.stack).split('\n').slice(0, 4).join('\n'));
}
window.onerror = function (msg, src, line, col) { fail('window @' + line + ':' + col, msg); };
window.addEventListener('beforeunload', function () {
  try { navigator.sendBeacon('/collect?name=bench', LINES.join('\n')); } catch (e) {}
});

try {
  var c = document.getElementById('c');
  var gl = c.getContext('webgl2', { alpha: false, antialias: false, depth: false,
    stencil: false, powerPreference: 'high-performance', preserveDrawingBuffer: false });
  if (!gl) throw new Error('webgl2 context is null');
  outEl.textContent = '';

  var dbg = gl.getExtension('WEBGL_debug_renderer_info');
  log('renderer: ' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'unknown'));
  log('float FBO: ' + (gl.getExtension('EXT_color_buffer_float') ? 'yes' : 'no') +
      '   float linear: ' + (gl.getExtension('OES_texture_float_linear') ? 'yes' : 'no'));
  log('');

  var VS = ['#version 300 es', 'in vec2 p;', 'void main(){ gl_Position = vec4(p,0.0,1.0); }'].join('\n');

  function FS(n) {
    return ['#version 300 es',
      'precision highp float;',
      'uniform vec2 R;',
      'uniform float T;',
      'out vec4 o;',
      'float map(vec3 q){ q = mod(q + 2.0, 4.0) - 2.0; return length(q) - 1.0; }',
      'void main(){',
      '  vec2 uv = (gl_FragCoord.xy * 2.0 - R) / R.y;',
      '  vec3 ro = vec3(0.0, 0.0, T);',
      '  vec3 rd = normalize(vec3(uv, 1.5));',
      '  float d = 0.0; float s = 0.0;',
      '  for (int i = 0; i < ' + n + '; i++) {',
      '    s = map(ro + rd * d);',
      '    d += s * 0.9;',
      '    if (s < 0.001 || d > 40.0) break;',
      '  }',
      '  vec3 pp = ro + rd * d;',
      '  vec2 e = vec2(0.001, 0.0);',
      '  vec3 nn = normalize(vec3(',
      '    map(pp + e.xyy) - map(pp - e.xyy),',
      '    map(pp + e.yxy) - map(pp - e.yxy),',
      '    map(pp + e.yyx) - map(pp - e.yyx)));',
      '  float li = max(dot(nn, normalize(vec3(0.6, 0.7, -0.4))), 0.0);',
      '  o = vec4(vec3(li) / (1.0 + d * 0.04), 1.0);',
      '}'].join('\n');
  }

  function mkShader(type, src, label) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(label + ' compile: ' + gl.getShaderInfoLog(s));
    return s;
  }
  function mkProgram(n) {
    var p = gl.createProgram();
    gl.attachShader(p, mkShader(gl.VERTEX_SHADER, VS, 'vs'));
    gl.attachShader(p, mkShader(gl.FRAGMENT_SHADER, FS(n), 'fs[' + n + ']'));
    gl.bindAttribLocation(p, 0, 'p');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
      throw new Error('link: ' + gl.getProgramInfoLog(p));
    return p;
  }

  var vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  var vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  log('context + geometry ok');

  var SIZES = [[960,540],[1280,720],[1440,810],[1920,1080]];
  var STEPS = [16, 32, 64, 96];
  var ABORT = false;
  var rows = [], jobs = [];
  for (var a = 0; a < SIZES.length; a++)
    for (var b = 0; b < STEPS.length; b++)
      jobs.push([SIZES[a][0], SIZES[a][1], STEPS[b]]);

  function pad(s, w) { s = '' + s; while (s.length < w) s += ' '; return s; }

  function bench(w, h, n) {
    c.width = w; c.height = h;
    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    var p = mkProgram(n);
    gl.useProgram(p);
    gl.uniform2f(gl.getUniformLocation(p, 'R'), gl.drawingBufferWidth, gl.drawingBufferHeight);
    var uT = gl.getUniformLocation(p, 'T');
    for (var i = 0; i < 8; i++) { gl.uniform1f(uT, i * 0.01); gl.drawArrays(gl.TRIANGLES, 0, 3); }
    gl.finish();
    var one0 = performance.now();
    gl.uniform1f(uT, 0.5); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish();
    var oneMs = performance.now() - one0;
    if (oneMs > 400) {
      gl.deleteProgram(p);
      return { w: gl.drawingBufferWidth, h: gl.drawingBufferHeight, n: n,
               ms: oneMs, fps: 1000 / oneMs, draws: 1, slow: true };
    }
    var draws = 0, t0 = performance.now(), el = 0;
    while (el < 250) {
      gl.uniform1f(uT, draws * 0.013); gl.drawArrays(gl.TRIANGLES, 0, 3);
      draws++; gl.finish(); el = performance.now() - t0;
    }
    gl.deleteProgram(p);
    var ms = el / draws;
    return { w: gl.drawingBufferWidth, h: gl.drawingBufferHeight, n: n, ms: ms, fps: 1000 / ms, draws: draws };
  }

  log('');
  log('GPU-time sweep. Each cell draws until 400ms of real work has elapsed,');
  log('timed with gl.finish() — not vsync-paced, so rows MUST differ.');
  log('');
  log(pad('SIZE',12) + pad('STEPS',7) + pad('DRAWBUF',12) + pad('MS/FRAME',11) + pad('FPS',9) + 'DRAWS');
  log('-------------------------------------------------------------');

  var idx = 0;
  function next() {
    try {
      if (idx >= jobs.length) {
        var ok = rows.filter(function (r) { return r.fps >= 58; });
        ok.sort(function (x, y) { return (y.w * y.h * y.n) - (x.w * x.h * x.n); });
        log('');
        if (ok.length) {
          var t = ok[0];
          log('RECOMMENDED: ' + t.w + 'x' + t.h + ' @ ' + t.n + ' steps -> ' + t.fps.toFixed(1) + ' fps');
          log('HEADROOM   : ' + (16.7 / t.ms).toFixed(2) + 'x the 60fps budget at that setting');
        } else {
          var bst = rows.slice().sort(function (x, y) { return y.fps - x.fps; })[0];
          log('RECOMMENDED: nothing held >=58 fps. Best: ' + bst.w + 'x' + bst.h +
              ' @ ' + bst.n + ' steps -> ' + bst.fps.toFixed(1) + ' fps');
        }
        log('');
        log('NOTE: a real show = shader + video texture + post chain.');
        log('Budget about HALF the measured cost for the shader stage alone.');
        log('SWEEP COMPLETE');
        return;
      }
      var j = jobs[idx++];
      log('  ... running ' + j[0] + 'x' + j[1] + ' @ ' + j[2] + ' steps');
      flush();
      var r = bench(j[0], j[1], j[2]);
      LINES.pop();
      rows.push(r);
      log(pad(j[0] + 'x' + j[1], 12) + pad(j[2], 7) + pad(r.w + 'x' + r.h, 12) +
          pad(r.ms.toFixed(2), 11) + pad(r.fps.toFixed(1), 9) + r.draws +
          (r.slow ? '   <-- very slow, single-draw estimate' : ''));
      flush();
      setTimeout(next, 60);
    } catch (e) { fail('bench row ' + idx, e); }
  }
  setTimeout(next, 50);
} catch (e) { fail('init', e); }
</script>

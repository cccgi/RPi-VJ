<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-03 ShaderHost Probe</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: monospace;
      color: #fff;
    }
    #c {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.75);
      padding: 10px 16px;
      border-radius: 6px;
      border: 1px solid #444;
      pointer-events: auto;
      z-index: 10;
    }
    #hud label, #hud span, #hud input {
      font-size: 14px;
      vertical-align: middle;
    }
    #hud input[type=range] {
      margin-left: 8px;
    }
    #error {
      color: #ff5555;
      margin-top: 6px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div><strong>FPS:</strong> <span id="fps-val">--</span></div>
    <div style="margin-top: 6px;">
      <label for="scale-slider"><strong>Scale:</strong></label>
      <input type="range" id="scale-slider" min="0.25" max="1.0" step="0.05" value="1.0">
      <span id="scale-val">1.00</span>
    </div>
    <div id="error"></div>
  </div>
  <canvas id="c"></canvas>

  <script type="module">
    import { ShaderHost } from '../src/gl.js';

    const canvas = document.getElementById('c');
    const fpsVal = document.getElementById('fps-val');
    const scaleSlider = document.getElementById('scale-slider');
    const scaleVal = document.getElementById('scale-val');
    const errEl = document.getElementById('error');

    const host = new ShaderHost(canvas, { scale: 1.0 });

    const plasmaShaderSrc = `#version 300 es
    precision highp float;
    out vec4 fragColor;
    uniform vec2 u_resolution;
    uniform float u_time;

    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution.xy;
      float v = 0.0;
      vec2 c = uv * 8.0 - vec2(20.0);
      v += sin(c.x + u_time);
      v += sin((c.y + u_time) / 2.0);
      v += sin((c.x + c.y + u_time) / 2.0);
      c += vec2(sin(u_time / 3.0), cos(u_time / 2.0));
      v += sin(sqrt(c.x * c.x + c.y * c.y + 1.0) + u_time);
      v = v / 2.0;
      vec3 col = vec3(sin(v * 3.14159), cos(v * 3.14159), sin(v * 3.14159 + 2.0));
      fragColor = vec4(col * 0.5 + 0.5, 1.0);
    }
    `;

    const res = host.compile(plasmaShaderSrc);
    if (!res.ok) {
      errEl.textContent = res.log;
    } else {
      host.use(res.program);
    }

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      host.resize(w, h);
    }
    window.addEventListener('resize', onResize);
    onResize();

    scaleSlider.addEventListener('input', (e) => {
      const s = parseFloat(e.target.value);
      scaleVal.textContent = s.toFixed(2);
      host.setScale(s);
    });

    let lastHudUpdate = 0;
    function loop(time) {
      const sec = time * 0.001;
      host.setUniforms({
        u_resolution: [canvas.width, canvas.height],
        u_time: sec
      });
      host.render();

      if (time - lastHudUpdate > 200) {
        fpsVal.textContent = host.fps.toFixed(1);
        lastHudUpdate = time;
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>

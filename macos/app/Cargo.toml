[package]
name = "rpi-vj-mac"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Desktop VJ app sharing the Pi engine's audio analysis, react modes and shader format"

[dependencies]
rpi-vj-native = { path = "../../engine" }
anyhow = "1"
serde_json = "1"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
glow = "0.16"
cpal = "0.15"
display-info = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libloading = "0.8"
midir = "0.10"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

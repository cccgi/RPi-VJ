<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPi-VJ Appliance V3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none !important;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050508;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .logo-box {
            position: relative;
            display: inline-block;
            padding: 12px 28px;
            border: 1px solid rgba(0, 255, 204, 0.4);
            border-radius: 4px;
            background: rgba(0, 255, 204, 0.03);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
        }
        .title {
            font-size: 28px;
            letter-spacing: 6px;
            font-weight: 700;
            color: #00ffcc;
            text-transform: uppercase;
        }
        .badge-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 5px;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1.0; transform: scale(1.2); }
        }
        .status-text {
            font-size: 13px;
            letter-spacing: 3px;
            color: #8892b0;
            text-transform: uppercase;
        }
        .footer {
            position: absolute;
            bottom: 30px;
            font-size: 11px;
            letter-spacing: 2px;
            color: #444b66;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-box">
            <div class="title">RPi-VJ V3</div>
        </div>
        <div class="badge-row">
            <div class="pulse-dot"></div>
            <div class="status-text" id="status-label">APPLIANCE READY &bull; STANDBY</div>
        </div>
    </div>
    <div class="footer">DETERMINISTIC 1080P60 &bull; PORT 0 &bull; CAGE WAYLAND</div>

    <script>
        // Automatic reconnection to show endpoint once broker/supervisor launches
        const TARGET_URL = "http://localhost:8080/gig/";
        let isNavigating = false;

        async function checkShowEndpoint() {
            if (isNavigating) return;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 1200);
                const response = await fetch(TARGET_URL, {
                    method: 'GET',
                    mode: 'no-cors',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                // Reachable! Transition immediately
                isNavigating = true;
                const statusEl = document.getElementById("status-label");
                if (statusEl) statusEl.textContent = "SHOW DETECTED • CONNECTING...";
                window.location.replace(TARGET_URL);
            } catch (err) {
                // Not yet listening; continue polling standby
            }
        }

        setInterval(checkShowEndpoint, 1500);
        setTimeout(checkShowEndpoint, 500);
    </script>
</body>
</html>

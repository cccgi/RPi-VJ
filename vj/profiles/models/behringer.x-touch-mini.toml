id = "behringer.x-touch-mini"
display_name = "Behringer X-Touch Mini"
driver = "generic"
feedback_hz = 30

# Standard (MIDI) mode, NOT Mackie Control. Encoders must be set to relative
# in X-Touch Editor on a PC or Mac before the unit is deployed to the Pi --
# the editor does not run on Linux and the setting is stored on the device.
[transport]
transport = "midi"
in_port = "X-TOUCH MINI"
out_port = "X-TOUCH MINI"

[[controls]]
id = "enc.0"

[controls.kind]
kind = "encoder"
detents = 24

[controls.input]
via = "cc"
channel = 0
number = 16
mode = "relative_twos_complement"

[controls.feedback]
feedback = "encoder_ring"
segments = 13
modes = ["single", "pan", "fan", "spread", "trim"]


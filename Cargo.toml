[package]
name = "rpi-vj"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "=1.0.75"
crossbeam-channel = "=0.5.8"
env_logger = "=0.10.1"
hidapi = { version = "=2.6.3", default-features = false, features = ["linux-static-hidraw"] }
image = { version = "=0.24.9", default-features = false, features = ["jpeg"] }
log = "=0.4.20"
serde = { version = "=1.0.188", features = ["derive"] }
serde_json = "=1.0.107"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
